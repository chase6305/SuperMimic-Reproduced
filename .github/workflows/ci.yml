name: CPU baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      UV_NO_CACHE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: .venv/bin/ruff check src tests scripts
      - name: Test CPU baseline
        run: .venv/bin/python -I -m pytest -q -ra
      - name: Check CLI and distribution build
        run: |
          ./supermimic --help
          uv build
          uv venv /tmp/supermimic-wheel
          uv pip install --no-deps --python /tmp/supermimic-wheel/bin/python dist/*.whl
          /tmp/supermimic-wheel/bin/python -I -m supermimic --help
